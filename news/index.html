<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Tin tức - Thanh Hải Ceramics</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="/src/assets/images/logo.png"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="/src/assets/css/main.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
        />
        <link
            href="https://unpkg.com/aos@2.3.1/dist/aos.css"
            rel="stylesheet"
        />
    </head>
    <body
        data-page="news"
        class="min-h-screen flex flex-col bg-neutral-2"
    >
        {{> header}}

        <main class="flex-grow">
            {{> news/hero}}
            {{> news/main-content}}
            {{> news/history-related}}
        </main>

        {{> footer}}

        <script
            type="module"
            src="/src/js/main.js"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <script>
            AOS.init({
                duration: 800,
                once: true,
                offset: 100,
            });
        </script>
    </body>
</html>
