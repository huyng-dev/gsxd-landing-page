<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trạng thái đơn hàng - Dịch vụ khách hàng - Thanh Hải Ceramics</title>
  <link rel="icon" type="image/svg+xml" href="/src/assets/images/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/assets/css/main.css">
</head>

<body data-page="customer-service" class="bg-white">
  {{> header}}

  <main class="bg-background-secondary min-h-screen">
    <div class="w-[85%] max-w-[1320px] mx-auto">
      {{> customer-service/breadcrumb currentPage="Trạng thái đơn hàng"}}
      
      <div class="flex flex-col lg:flex-row gap-12 mb-6 lg:mb-12">
        <!-- Sidebar -->
        {{> customer-service/sidebar activeOrder=true}}
        
        <!-- Content Area -->
        {{> customer-service/order-status}}
      </div>

      {{> faq/faq-contact}}
    </div>
  </main>

  {{> footer}}

  <script type="module" src="/src/js/main.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      once: true,
      offset: 100,
    });
  </script>
</body>

</html>
