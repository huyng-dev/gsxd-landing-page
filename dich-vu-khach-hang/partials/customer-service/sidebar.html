  <!-- Sidebar Content (Desktop: always visible, Mobile: expanded by default) -->
  <div id="sidebar-content"

    <nav class="flex flex-col lg:border-t border-gray-300 text-sm">

           Tài khoản của tôi
        </a>
        <a href="/dich-vu-khach-hang/tai-catalog.html" 
           class="py-4 border-b border-gray-300 transition-colors hover:underline font-bold {{#if activeCatalog}}text-primary decoration-primary underline underline-offset-4{{else}}text-primary{{/if}}">
           Tải Catalog
        </a>
        <a href="/dich-vu-khach-hang/quy-trinh-dat-hang.html" 
           class="py-4 border-b border-gray-300 transition-colors hover:underline font-bold {{#if activeProcess}}text-primary decoration-primary underline underline-offset-4{{else}}text-primary{{/if}}">
           Quy trình đặt hàng
        </a>
        <a href="/dich-vu-khach-hang/huong-dan-thi-cong.html" 
           class="py-4 border-b border-gray-300 transition-colors hover:underline font-bold {{#if activeGuide}}text-primary decoration-primary underline underline-offset-4{{else}}text-primary{{/if}}">
           Hướng dẫn thi công
        </a>
      </div>

      <!-- More Toggle (Mobile only, centered and at bottom of initial 5) -->
      <div id="mobile-more-toggle" class="lg:hidden flex justify-center py-5 cursor-pointer">
        <img src="/assets/images/plus-circle.svg" alt="More" class="w-[22px] h-[22px]">
      </div>

      <!-- Remaining items -->
      <div id="sidebar-items-more" class="hidden lg:flex flex-col w-full">
        <a href="/dich-vu-khach-hang/chinh-sach-van-chuyen.html"

           Chính sách vận chuyển

           class="mb-6 lg:mb-0 py-4 border-b border-gray-300 transition-colors hover:underline font-bold {{#if activeFaq}}text-primary decoration-primary underline underline-offset-4{{else}}text-primary{{/if}}">
           FAQ
        </a>
      </div>
    </nav>
  </div>
</aside>

{{#push "scripts"}}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.getElementById('mobile-sidebar-toggle');
    const content = document.getElementById('sidebar-content');
    const chevron = document.getElementById('mobile-sidebar-chevron');
    const moreToggle = document.getElementById('mobile-more-toggle');
    const moreItems = document.getElementById('sidebar-items-more');

    if (toggle && content && chevron) {
      toggle.addEventListener('click', () => {
        const isHidden = content.classList.contains('hidden');
        if (isHidden) {
          content.classList.remove('hidden');
          chevron.style.transform = 'rotate(90deg)';
        } else {
          content.classList.add('hidden');
          chevron.style.transform = 'rotate(0deg)';
          // Reset "more" section when closing
          if (moreItems && moreToggle) {
            moreItems.classList.add('hidden');
            moreToggle.classList.remove('hidden');
          }
        }
      });
    }

      moreToggle.addEventListener('click', () => {
        moreItems.classList.remove('hidden');
        moreItems.classList.add('flex');
        moreToggle.classList.add('hidden');
      });
  });
</script>
{{/push}}
