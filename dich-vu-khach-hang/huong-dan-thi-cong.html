<!doctype html>

    />
    <title>Hướng dẫn thi công - Dịch vụ khách hàng - Thanh Hải Ceramics</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/images/logo.svg"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="/src/assets/css/main.css"
    />
  </head>

  <body
    data-page="customer-service"

                >
                  Xem hướng dẫn
                  <img
                    src="/src/assets/images/triangle.svg"
                    alt=""
                    class="w-[6px] h-[10px] rotate-180 scale-x-[-1] ml-4"
                  />
                </button>
              </div>
