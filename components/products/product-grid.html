<!-- ============================================== -->
<!-- COMPONENT LƯỚI SẢN PHẨM Ở TRANG DANH MỤC THÀNH PHẦN -->
<!-- ============================================== -->
<section
  class="w-[85%] max-w-[1320px] mx-auto pb-[43px] md:pb-16 animate-fade-in-up"
>
  <!-- Danh sách Lưới Sản phẩm (Mặc định hiển thị dạng Grid 4 cột trên PC, 2 cột trên Mobile) -->
  <div
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-[16px] gap-y-[30px] sm:gap-x-6 sm:gap-y-14"
    data-aos="fade-up"
    data-aos-delay="200"
  >
    {{#for 8}}
    <a href="#" class="flex flex-col group cursor-pointer">
      <div
        class="product-card relative bg-white rounded-sm shadow-lg overflow-hidden mb-4 aspect-square transition-all duration-300 group-hover:-translate-y-1"
      >
        <img
          src="/assets/images/ngoi-01.jpg"
          alt="Riềm Âm Dương Sen Bầu"
          class="w-full h-full object-cover mix-blend-multiply"
        />
        <div class="product-overlay">
          <img src="/assets/images/eye.svg" alt="Search" />
          <span>Xem chi tiết</span>
        </div>
      </div>
      <h3
        class="text-primary font-semibold text-sm uppercase mb-2 transition-colors group-hover:text-secondary"
      >
        <span class="block lowercase first-letter:uppercase md:uppercase"
          >Riềm âm dương sen bầu</span
        >
      </h3>
      <p class="text-gray-500 text-[13px] mb-2">MSP: 1234RDS</p>
      <p class="text-secondary font-bold text-[14px]">Giá: 675.000 đ/m2</p>
    </a>
    {{/for}}
  </div>

  <!-- Component Phân Trang (Pagination) dưới cùng của Lưới Sản phẩm -->
  <div
    class="flex items-center justify-between gap-6 mt-[40px] md:mt-16 text-textPrimary font-bold text-[17px]"
  >
    <!-- Prev Button (Nút quay lại trang trước) -->
    <button
      class="w-10 h-10 border-2 border-black/20 rounded-full flex items-center justify-center text-black/40 hover:border-black hover:text-black transition-all cursor-pointer"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        ></path>
      </svg>
    </button>

    <!-- Page Numbers (Chỉ số thứ tự trang) -->
    <div class="flex items-center gap-5">
      <!-- Nút trang đang active (có border dưới) -->
      <a href="#" class="text-black border-b-[3px] border-black pb-[2px] px-1"
        >1</a
      >
      <!-- Các nút trang chưa chọn -->
      <a href="#" class="text-black/40 hover:text-black transition-colors px-1"
        >2</a
      >
      <a href="#" class="text-black/40 hover:text-black transition-colors px-1"
        >3</a
      >
      <!-- Dấu ba chấm đại diện cho các trang bị ẩn -->
      <span class="text-black/40 tracking-widest px-1">...</span>
      <a href="#" class="text-black/40 hover:text-black transition-colors px-1"
        >9</a
      >
    </div>

    <!-- Next Button (Nút sang trang tiếp theo) -->
    <button
      class="w-10 h-10 border-2 border-black/20 rounded-full flex items-center justify-center text-black/40 hover:border-black hover:text-black transition-all cursor-pointer"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5l7 7-7 7"
        ></path>
      </svg>
    </button>
  </div>
</section>
