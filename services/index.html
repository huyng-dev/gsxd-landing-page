<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - GSXD Landing Page</title>
  <link rel="stylesheet" href="/src/assets/css/main.css">
</head>
<body data-page="services" class="min-h-screen flex flex-col bg-gray-50">
  {{> header}}
  
  <main class="flex-grow">
    <section class="py-16">
      <div class="container mx-auto px-6">
        <h1 class="text-4xl font-bold mb-12 text-center">Our Services</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="bg-white p-8 rounded-lg shadow-lg">
            <h3 class="text-2xl font-semibold mb-4">Web Development</h3>
            <p class="text-gray-600">Custom web applications built with modern technologies.</p>
          </div>
          <div class="bg-white p-8 rounded-lg shadow-lg">
            <h3 class="text-2xl font-semibold mb-4">UI/UX Design</h3>
            <p class="text-gray-600">Beautiful, intuitive designs that users love.</p>
          </div>
          <div class="bg-white p-8 rounded-lg shadow-lg">
            <h3 class="text-2xl font-semibold mb-4">Digital Marketing</h3>
            <p class="text-gray-600">Strategies to grow your online presence.</p>
          </div>
          <div class="bg-white p-8 rounded-lg shadow-lg">
            <h3 class="text-2xl font-semibold mb-4">Consulting</h3>
            <p class="text-gray-600">Expert guidance for your digital transformation.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  {{> footer}}
  
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
