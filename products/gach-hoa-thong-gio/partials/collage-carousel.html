      var slide = SLIDES[i];
      var squaresHtml = "";

        var sq = slide.squares[s];
        squaresHtml +=
          '<div class="absolute" style="background:' +
          sq.color +
          ";" +
          sq.style +
          '"></div>';
      }
      var imagesHtml = "";
      for (var j = 0; j < slide.images.length; j++) {
        var img = slide.images[j];
        var isFocal = img.zClass === "z-30";
        var hoverScale = isFocal ? "hover:scale-[1.02]" : "hover:scale-105";
        var zClass = img.zClass || "z-20";
        imagesHtml +=
          '<a href="' +
          img.href +
          '" class="glightbox absolute ' +
          img.shadow +
          " transition-transform " +
          hoverScale +
          " " +
          zClass +
          '" style="' +
          img.style +
          '" data-gallery="' +
          slide.gallery +
          '">' +
          '<img src="' +
          img.src +
          '" class="w-full h-full object-cover" alt="' +
          img.alt +
          '" />' +
          "</a>";
      }

      slideEl.className = "swiper-slide w-full";
      slideEl.innerHTML =
        '<div class="relative w-full aspect-[4/3] sm:aspect-[16/9] md:aspect-[2.5/1]">' +
        squaresHtml +
        imagesHtml +
        "</div>";
      wrapper.appendChild(slideEl);

      slidesPerView: 1,
      speed: 600,
      loop: false,
      allowTouchMove: true,
    });

    // â”€â”€ Custom pagination helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    var VISIBLE_PAGES = 3; // how many page numbers to show before the ellipsis
    var total = SLIDES.length;

    function buildPagination(activeIdx) {
      var pag = document.getElementById("collage-pagination");
      if (!pag) return;
      pag.innerHTML = "";

      // Determine which page numbers to show
      // Always show 1..VISIBLE_PAGES and last page, with '...' between them
      var shown = [];
      for (var p = 0; p < total && p < VISIBLE_PAGES; p++) shown.push(p);
      var hasEllipsis = total > VISIBLE_PAGES + 1;
      var showLast = total > VISIBLE_PAGES;

      shown.forEach(function (idx) {
        var a = document.createElement("a");
        a.href = "#";
        a.textContent = idx + 1;
        if (idx === activeIdx) {
          a.className = "text-black border-b-[3px] border-black pb-[2px] px-1";
        } else {
          a.className = "text-black/40 hover:text-black transition-colors px-1";
        }
        a.addEventListener("click", function (e) {
          e.preventDefault();
          swiper.slideTo(idx);
        });
        pag.appendChild(a);
      });

      if (hasEllipsis) {
        var dots = document.createElement("span");
        dots.textContent = "...";
        dots.className = "text-black/40 tracking-widest px-1";
        pag.appendChild(dots);
      }

      if (showLast) {
        var lastIdx = total - 1;
        var la = document.createElement("a");
        la.href = "#";
        la.textContent = total;
        la.className =
          lastIdx === activeIdx
            ? "text-black border-b-[3px] border-black pb-[2px] px-1"
            : "text-black/40 hover:text-black transition-colors px-1";
        la.addEventListener("click", function (e) {
          e.preventDefault();
          swiper.slideTo(lastIdx);
        });
        pag.appendChild(la);
      }
    }

    buildPagination(0);

    swiper.on("slideChange", function () {
      buildPagination(swiper.activeIndex);
    });
