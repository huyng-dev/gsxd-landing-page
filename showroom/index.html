    <!-- Swiper Initialization -->
    <script>
      if (window.AOS) {
        AOS.init({ once: true, duration: 800, offset: 50 });
      }

      if (window.Swiper) {
        new Swiper(".showroomSwiper", {
          slidesPerView: "auto",
          spaceBetween: 24,
          loop: false,
          navigation: {
            nextEl: ".showroom-next",
            prevEl: ".showroom-prev",
          },
        });

        new Swiper(".showroomSwiper2", {
          slidesPerView: "auto",
          spaceBetween: 24,
          loop: false,
          initialSlide: 1,
          rtl: true,
        });
