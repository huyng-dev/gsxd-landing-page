<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Showroom - Thanh Hải Ceramics</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/logo.png"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Italianno&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap");
    </style>
    <link
      rel="stylesheet"
      href="/assets/css/main.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      href="https://unpkg.com/aos@2.3.1/dist/aos.css"
      rel="stylesheet"
    />
    {{{stack "styles"}}}
</head>
  <body class="min-h-screen flex flex-col bg-primary text-white font-archivo">
    {{> components/header}}

    <main class="flex-grow">
      {{> showroom/partials/top-banner}}
      {{> showroom/partials/showroom-main-content}}
      {{> showroom/partials/room-display-content}}
      {{> showroom/partials/showroom-map-section}}
    </main>

    {{> components/footer}}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script
      type="module"
      src="/assets/js/main.js"
    ></script>

    <!-- Swiper Initialization -->
    <script>
      if (window.AOS) {
        AOS.init({ once: true, duration: 800, offset: 50 });
      }

      if (window.Swiper) {
        new Swiper(".showroomSwiper", {
          slidesPerView: "auto",
          spaceBetween: 24,
          loop: false,
          navigation: {
            nextEl: ".showroom-next",
            prevEl: ".showroom-prev",
          },
        });

        new Swiper(".showroomSwiper2", {
          slidesPerView: "auto",
          spaceBetween: 24,
          loop: false,
          initialSlide: 1,
          rtl: true,
        });
      }
    </script>
    {{{stack "scripts"}}}
</body>
</html>
