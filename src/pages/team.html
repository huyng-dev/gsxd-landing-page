<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team - GSXD Landing Page</title>
</head>
<body data-page="team" class="min-h-screen flex flex-col bg-gray-50">
  {{> header}}
  
  <main class="flex-grow">
    <section class="py-16">
      <div class="container mx-auto px-6">
        <h1 class="text-4xl font-bold mb-12 text-center">Our Team</h1>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
          <div class="bg-white p-6 rounded-lg shadow-lg text-center">
            <div class="w-32 h-32 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h3 class="text-xl font-semibold mb-2">John Doe</h3>
            <p class="text-gray-600">CEO & Founder</p>
          </div>
          <div class="bg-white p-6 rounded-lg shadow-lg text-center">
            <div class="w-32 h-32 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h3 class="text-xl font-semibold mb-2">Jane Smith</h3>
            <p class="text-gray-600">CTO</p>
          </div>
          <div class="bg-white p-6 rounded-lg shadow-lg text-center">
            <div class="w-32 h-32 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h3 class="text-xl font-semibold mb-2">Mike Johnson</h3>
            <p class="text-gray-600">Lead Developer</p>
          </div>
          <div class="bg-white p-6 rounded-lg shadow-lg text-center">
            <div class="w-32 h-32 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h3 class="text-xl font-semibold mb-2">Sarah Williams</h3>
            <p class="text-gray-600">Design Lead</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  {{> footer}}
  
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
