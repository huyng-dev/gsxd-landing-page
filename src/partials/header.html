<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Highlight Active Link
    const currentPath = window.location.pathname;
    
    // Normalize path (ensure trailing slash for comparison if needed, or matched exactly)
    // Simple matching:
    const desktopLinks = document.querySelectorAll('.nav-link');
    const mobileLinks = document.querySelectorAll('.mobile-nav-link');

    const setActive = (link) => {
      // Remove default Active styling if any (using text-[#FFFAF3])
      link.classList.remove('text-[#FFFAF3]');
      // Add Active styling
      link.classList.add('text-secondary', 'underline', 'decoration-secondary', 'decoration-[1.6px]', 'underline-offset-[6.4px]');
      
      // For mobile links
      if (link.classList.contains('mobile-nav-link')) {
         link.classList.add('text-secondary');
      }
    };

    // Find matching link
    // Priority: Exact match -> Parent match (e.g. /products/detail -> /products/)
    let activeLinkFound = false;

    [...desktopLinks, ...mobileLinks].forEach(link => {
       const linkPath = link.getAttribute('data-path');
       if (currentPath === linkPath || (currentPath === '/index.html' && linkPath === '/') || (linkPath !== '/' && currentPath.startsWith(linkPath))) {
          setActive(link);
       }
    });

    // 2. Mobile Menu Toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-button');
    const closeMenuBtn = document.getElementById('close-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');

    const toggleMenu = () => {
      mobileMenu.classList.toggle('hidden');
      // Prevent body scroll when menu is open
      if (!mobileMenu.classList.contains('hidden')) {
        document.body.style.overflow = 'hidden';
      } else {
        document.body.style.overflow = '';
      }
    };

    mobileMenuBtn?.addEventListener('click', toggleMenu);
    closeMenuBtn?.addEventListener('click', toggleMenu);
    
    // Close menu when clicking a link
    mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
             if (!mobileMenu.classList.contains('hidden')) toggleMenu();
        });
    });
  });
</script>
