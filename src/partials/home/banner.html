<section class="banner-section relative bg-primary overflow-hidden">
  <!-- Decorative background images -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <!-- Left decorative element (mirrored) -->
    <img src="/src/assets/images/background-decorate.svg" alt="" class="banner-decor-left absolute left-0 bottom-0 lg:-bottom-64 h-full object-contain opacity-60" style="transform: scaleX(-1); max-width: 420px; clip-path: inset(0 1px 42% 0);">
    <!-- Right decorative element -->
    <img src="/src/assets/images/background-decorate.svg" alt="" class="banner-decor-right absolute -right-[130px] lg:-right-[100px] w-[300px] lg:w-auto -top-36 lg:-top-[88px] h-full object-contain opacity-60" style="max-width: 670px;">
  </div>
  <!-- Carousel container centered -->
  <div class="banner-carousel relative w-[85%] lg:w-[75%] mx-auto h-full z-10">
    <!-- Slides -->
    <div class="banner-slide active absolute inset-0 transition-opacity duration-500">
      <img src="/src/assets/images/banner-01.png" alt="Banner 1" class="w-full h-full object-cover">
      <div class="absolute inset-0 flex items-end justify-center pb-16">
        <a href="#" class="banner-cta-btn">
          XEM CHI TIẾT
        </a>
      </div>
    </div>

    <div class="banner-slide active absolute inset-0 transition-opacity duration-500">
      <img src="/src/assets/images/banner-01.png" alt="Banner 2" class="w-full h-full object-cover">
      <div class="absolute inset-0 flex items-end justify-center pb-16">
        <a href="#" class="banner-cta-btn">
          XEM CHI TIẾT
        </a>
      </div>
    </div>

    <div class="banner-slide active absolute inset-0 transition-opacity duration-500">
      <img src="/src/assets/images/banner-01.png" alt="Banner 3" class="w-full h-full object-cover">
      <div class="absolute inset-0 flex items-end justify-center pb-16">
        <a href="#" class="banner-cta-btn">
          XEM CHI TIẾT
        </a>
      </div>
    </div>

    <div class="banner-slide active absolute inset-0 transition-opacity duration-500">
      <img src="/src/assets/images/banner-01.png" alt="Banner 4" class="w-full h-full object-cover">
      <div class="absolute inset-0 flex items-end justify-center pb-16">
        <a href="#" class="banner-cta-btn">
          XEM CHI TIẾT
        </a>
      </div>
    </div>
  </div>

  <!-- Banner Navigation - positioned at bottom outside carousel -->
  <button class="banner-prev absolute left-[7.5%] lg:left-[12.5%] bottom-2 lg:bottom-6 z-20 w-10 h-10 border border-white/50 rounded-full flex items-center justify-center text-white/70 hover:border-white hover:text-white transition-all" aria-label="Previous slide">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
  </button>

  <button class="banner-next absolute right-[7.5%] lg:right-[12.5%] bottom-2 lg:bottom-6 z-20 w-10 h-10 border border-white/50 rounded-full flex items-center justify-center text-white/70 hover:border-white hover:text-white transition-all" aria-label="Next slide">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>

  <!-- Banner Dots -->
  <div class="absolute bottom-4 lg:bottom-8 left-1/2 transform -translate-x-1/2 flex gap-3 z-20">
    <button class="banner-dot active w-3 h-3 rounded-full bg-secondary transition-all" data-slide="0" aria-label="Slide 1"></button>
    <button class="banner-dot w-3 h-3 rounded-full bg-white/40 hover:bg-white/60 transition-all" data-slide="1" aria-label="Slide 2"></button>
    <button class="banner-dot w-3 h-3 rounded-full bg-white/40 hover:bg-white/60 transition-all" data-slide="2" aria-label="Slide 3"></button>
    <button class="banner-dot w-3 h-3 rounded-full bg-white/40 hover:bg-white/60 transition-all" data-slide="3" aria-label="Slide 4"></button>
  </div>
</section>
