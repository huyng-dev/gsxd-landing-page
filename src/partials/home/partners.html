<section class="bg-primary py-12 lg:py-16 relative">
  <div class="w-[85%] lg:w-[75%] mx-auto">
    <h2 class="text-secondary text-3xl lg:text-4xl font-bold uppercase mb-12">Khách hàng & đối tác</h2>
    
    <div class="flex overflow-x-auto snap-x snap-mandatory gap-6 mb-6 scrollbar-hide -mx-6 px-6 lg:mx-0 lg:px-0 lg:grid lg:grid-cols-5">
      <div class="flex-shrink-0 w-[40vw] sm:w-[30vw] lg:w-auto h-40 flex items-center justify-center rounded-lg p-6 snap-center">
        <img src="/src/assets/images/partner-01.png" alt="Partner" class="max-w-full max-h-full">
      </div>
      <div class="flex-shrink-0 w-[40vw] sm:w-[30vw] lg:w-auto h-40 flex items-center justify-center rounded-lg py-6 snap-center">
        <img src="/src/assets/images/partner-02.png" alt="Partner" class="max-w-full max-h-full">
      </div>
      <div class="flex-shrink-0 w-[40vw] sm:w-[30vw] lg:w-auto h-40 flex items-center justify-center rounded-lg py-6 snap-center">
        <img src="/src/assets/images/partner-03.png" alt="Partner" class="max-w-full max-h-full">
      </div>
      <div class="flex-shrink-0 w-[40vw] sm:w-[30vw] lg:w-auto h-40 flex items-center justify-center rounded-lg py-6 snap-center">
        <img src="/src/assets/images/partner-04.png" alt="Partner" class="max-w-full max-h-full">
      </div>
      <div class="flex-shrink-0 w-[40vw] sm:w-[30vw] lg:w-auto h-40 flex items-center justify-center rounded-lg py-6 snap-center">
        <img src="/src/assets/images/partner-05.png" alt="Partner" class="max-w-full max-h-full">
      </div>
    </div>
  </div>

  <!-- Partners Navigation -->
  <button class="partner-prev hidden lg:flex absolute left-[6%] xl:left-[7%] top-[60%] -translate-y-1/2 z-20 w-10 h-10 border border-white/50 rounded-full items-center justify-center text-white/70 hover:border-white hover:text-white transition-all focus:outline-none" aria-label="Previous partner">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
  </button>

  <button class="partner-next hidden lg:flex absolute right-[6%] xl:right-[7%] top-[60%] -translate-y-1/2 z-20 w-10 h-10 border border-white/50 rounded-full items-center justify-center text-white/70 hover:border-white hover:text-white transition-all focus:outline-none" aria-label="Next partner">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>

  <!-- Partners Dots -->
  <div class="hidden lg:flex absolute bottom-6 left-1/2 transform -translate-x-1/2 gap-3 z-20">
    <button class="partner-dot active w-3 h-3 rounded-full bg-secondary transition-all" data-slide="0" aria-label="Page 1"></button>
    <button class="partner-dot w-3 h-3 rounded-full bg-white/40 hover:bg-white/60 transition-all" data-slide="1" aria-label="Page 2"></button>
    <button class="partner-dot w-3 h-3 rounded-full bg-white/40 hover:bg-white/60 transition-all" data-slide="2" aria-label="Page 3"></button>
    <button class="partner-dot w-3 h-3 rounded-full bg-white/40 hover:bg-white/60 transition-all" data-slide="3" aria-label="Page 4"></button>
  </div>
</section>
