<section

        <div class="absolute bottom-6 left-1/2 -translate-x-1/2">
          <div class="border border-white/60 bg-black/20 backdrop-blur-sm px-10 py-2">
            <span class="text-white font-semibold text-sm tracking-[0.2em] uppercase whitespace-nowrap">ỐP MÁI</span>
          </div>
        </div>
      </div>

      <!-- Item 2 -->

        <img
          src="/src/assets/images/am-duong-detail-02.png"
          alt="Bờ rào"

          </div>
        </div>
      </div>

    <!-- Bottom: 5 icons with text -->

      <!-- Icon 1 -->
      <div class="flex flex-col items-center gap-6 group cursor-pointer">
        <div class="w-16 h-16 flex items-center justify-center transition-transform duration-300 group-hover:-translate-y-2">

        <div class="w-16 h-16 flex items-center justify-center transition-transform duration-300 group-hover:-translate-y-2">
