<!-- DẤU ẤN TRÊN NHỮNG CÔNG TRÌNH SECTION -->
<section
  class="w-full pb-16 md:pb-24 bg-background-secondary overflow-hidden"
  data-aos="fade-up"
>
  <div class="max-w-[1920px] mx-auto">
    <h2 class="text-2xl md:text-3xl font-bold text-secondary text-center uppercase tracking-[0.15em] mb-12 md:mb-16">
      DẤU ẤN TRÊN NHỮNG CÔNG TRÌNH
    </h2>

    <div class="relative px-4 md:px-0">
      <!-- Swiper Container -->
      <div class="swiper projects-slider overflow-visible">
        <div class="swiper-wrapper">
          <!-- Slide 1 -->
          <div class="swiper-slide transition-all duration-500">
            <div class="aspect-[3/2] md:aspect-[4/3] overflow-hidden rounded-sm shadow-xl">
              <img
                src="/src/assets/images/gach-co-work-1.jpg"
                alt="Dấu ấn trên những công trình"
                class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-700"
              />
            </div>
          </div>
          <!-- Slide 2 -->
          <div class="swiper-slide transition-all duration-500">
            <div class="aspect-[3/2] md:aspect-[4/3] overflow-hidden rounded-sm shadow-xl">
              <img
                src="/src/assets/images/trang-tri-slide-01.jpg"
                alt="Dấu ấn trên những công trình"
                class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-700"
              />
            </div>
          </div>
          <!-- Slide 3 -->
          <div class="swiper-slide transition-all duration-500">
            <div class="aspect-[3/2] md:aspect-[4/3] overflow-hidden rounded-sm shadow-xl">
              <img
                src="/src/assets/images/gach-co-work-2.jpg"
                alt="Dấu ấn trên những công trình"
                class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-700"
              />
            </div>
          </div>
          <!-- Slide 4 -->
          <div class="swiper-slide transition-all duration-500">
            <div class="aspect-[3/2] md:aspect-[4/3] overflow-hidden rounded-sm shadow-xl">
              <img
                src="/src/assets/images/gach-co-work-1.jpg"
                alt="Dấu ấn trên những công trình"
                class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-700"
              />
            </div>
          </div>
          <!-- Slide 5 -->
          <div class="swiper-slide transition-all duration-500">
            <div class="aspect-[3/2] md:aspect-[4/3] overflow-hidden rounded-sm shadow-xl">
              <img
                src="/src/assets/images/gach-co-work-2.jpg"
                alt="Dấu ấn trên những công trình"
                class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-700"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Pagination dots -->
      <div class="projects-pagination mt-10 md:mt-12 flex justify-center gap-3"></div>

      {{#if showNav}}
      <!-- Navigation Buttons -->
      <div class="projects-prev absolute left-2 md:left-6 lg:left-10 top-1/3 md:top-1/2 -translate-y-1/2 z-20 w-10 h-10 md:w-12 md:h-12 bg-secondary rounded rotate-45 flex items-center justify-center text-white cursor-pointer hover:bg-secondary/90 shadow-lg transition-all">
          <div class="-rotate-45">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </div>
      </div>
      <div class="projects-next absolute right-2 md:right-6 lg:right-10 top-1/3 md:top-1/2 -translate-y-1/2 z-20 w-10 h-10 md:w-12 md:h-12 bg-secondary rounded rotate-45 flex items-center justify-center text-white cursor-pointer hover:bg-secondary/90 shadow-lg transition-all">
          <div class="-rotate-45">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </div>
      </div>
      {{/if}}
    </div>
  </div>
</section>
