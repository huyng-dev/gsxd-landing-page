<section class="bg-primary text-white py-16 lg:py-20">
  <div class="w-[85%] max-w-[1320px] mx-auto">
    <h2 class="text-secondary text-2xl lg:text-4xl font-bold uppercase mb-12" data-aos="fade-up">Tại sao lựa chọn TH Ceramics</h2>
    <!-- Video Player Placeholder -->
    <div class="relative w-full aspect-video mb-12 rounded-lg overflow-hidden cursor-pointer group" data-aos="fade-up" data-aos-delay="200">
      <img src="/assets/images/video-placeholder.jpg" alt="Video placeholder" class="w-full h-full object-cover brightness-50 group-hover:brightness-[0.4] transition-all duration-300">
      <!-- Play Button -->
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-16 h-16 lg:w-20 lg:h-20 bg-white/30 backdrop-blur-sm rounded-full flex items-center justify-center group-hover:bg-white/50 transition-all duration-300">
          <svg class="w-8 h-8 lg:w-10 lg:h-10 text-white ml-1" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </div>
      </div>
    </div>
    
    <!-- Stats Grid -->
    <div class="grid grid-cols-2 lg:grid-cols-5 gap-8" data-aos="fade-up" data-aos-delay="400">
      <div>
        <div class="text-4xl lg:text-[42px] font-bold text-neutral-1 mb-3"><span class="stat-number" data-target="1000">0</span></div>
        <p class="text-neutral-1 font-semibold text-xl">Công trình lớn nhỏ</p>
      </div>
      <div>
        <div class="text-4xl lg:text-[42px] font-bold text-neutral-1 mb-3"><span class="stat-number" data-target="5000">0</span>m<sup>2</sup></div>
        <p class="text-neutral-1 font-semibold text-xl">Nhà xưởng</p>
      </div>
      <div>
        <div class="text-4xl lg:text-[42px] font-bold text-neutral-1 mb-3"><span class="stat-number" data-target="100" data-suffix="%">0%</span></div>
        <p class="text-neutral-1 font-semibold text-xl">Sản xuất thủ công</p>
      </div>
      <div>
        <div class="text-4xl lg:text-[42px] font-bold text-neutral-1 mb-3"><span class="stat-number" data-target="50">0</span></div>
        <p class="text-neutral-1 font-semibold text-xl">Dòng sản phẩm</p>
      </div>
      <div>
        <div class="text-4xl lg:text-[42px] font-bold text-neutral-1 mb-3"><span class="stat-number" data-target="40">0</span></div>
        <p class="text-neutral-1 font-semibold text-xl">Năm kinh nghiệm</p>
      </div>
    </div>

    {{#push "scripts"}}
<script>
      (function () {
        const counters = document.querySelectorAll('.stat-number');
        if (!counters.length) return;

        // Store active interval per element
        const timers = new WeakMap();

        const reset = (el) => {
          if (timers.has(el)) {
            clearInterval(timers.get(el));
            timers.delete(el);
          }
          const suffix = el.getAttribute('data-suffix') || '';
          el.textContent = '0' + suffix;
        };

        const animate = (el) => {
          // Clear any existing animation first
          if (timers.has(el)) {
            clearInterval(timers.get(el));
            timers.delete(el);
          }

          const target = parseInt(el.getAttribute('data-target'), 10);
          const suffix = el.getAttribute('data-suffix') || '';
          const duration = 3000;
          const frameDuration = 1000 / 60;
          const totalFrames = Math.round(duration / frameDuration);
          let frame = 0;

          const easeOut = (t) => 1 - Math.pow(1 - t, 4);

          const id = setInterval(() => {
            frame++;
            const progress = easeOut(frame / totalFrames);
            const current = Math.round(progress * target);
            el.textContent = current + suffix;
            if (frame >= totalFrames) {
              el.textContent = target + suffix;
              clearInterval(id);
              timers.delete(el);
            }
          }, frameDuration);

          timers.set(el, id);
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              animate(entry.target);
            } else {
              // Reset when scrolled away so it replays next time
              reset(entry.target);
            }
          });
        }, { threshold: 0.4 });

        counters.forEach((el) => observer.observe(el));
      })();
    </script>
{{/push}}
  </div>
</section>
